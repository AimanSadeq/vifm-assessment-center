<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARC - Organizational AI Readiness Dashboard</title>
<style>
  :root{
    --navy:#010131; --navy2:#121232; --accent:#5391D5; --accent-deep:#2f6fb8;
    --bg:#eef1f6; --card:#ffffff; --ink:#121232; --muted:#5b6472; --line:#e2e7ef;
    --green:#059669; --greenbg:#dcfce7; --amber:#D97706; --amberbg:#fef3c7; --rose:#E11D48; --rosebg:#ffe4e6;
    --font:"Open Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    --ar:"Segoe UI","Tahoma",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  [dir="rtl"]{font-family:var(--ar)}
  .app{max-width:1180px;margin:0 auto;padding:20px 22px 60px}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(150deg,var(--accent),var(--accent-deep));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;flex:0 0 auto;
    box-shadow:0 6px 16px rgba(1,1,49,.18)}
  .brand h1{font-size:18px;font-weight:800;letter-spacing:-.01em;color:var(--navy)}
  .brand .sub{font-size:12px;color:var(--muted);font-weight:600}
  .hgroup{display:flex;align-items:center;gap:10px}
  .sample-badge{font-size:11px;font-weight:700;color:#92400e;background:var(--amberbg);border:1px solid #fcd34d;
    padding:5px 10px;border-radius:100px;white-space:nowrap}
  .langtoggle{display:flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:var(--card)}
  .langtoggle button{border:0;background:transparent;padding:7px 14px;font-family:var(--font);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .langtoggle button.on{background:var(--navy);color:#fff}

  .orgline{font-size:13px;color:var(--muted);margin-bottom:14px}
  .orgline b{color:var(--ink)}

  .crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;font-size:13px}
  .crumbs button{border:0;background:transparent;color:var(--accent-deep);font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;padding:0}
  .crumbs button:hover{text-decoration:underline}
  .crumbs .sep{color:var(--muted)}
  .crumbs .here{color:var(--ink);font-weight:800}

  .kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}
  @media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(1,1,49,.04)}
  .kpi.overall{background:linear-gradient(155deg,var(--navy),var(--navy2));color:#fff;border-color:transparent}
  .kpi .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .kpi.overall .lbl{color:rgba(255,255,255,.7)}
  .kpi .val{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi .of{font-size:13px;font-weight:600;color:var(--muted)}
  .kpi.overall .of{color:rgba(255,255,255,.6)}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:100px;margin-top:6px;letter-spacing:.02em}
  .pill.embedded{background:var(--greenbg);color:#166534}
  .pill.practising{background:var(--amberbg);color:#92400e}
  .pill.emerging{background:var(--rosebg);color:#9f1239}
  .kpi.overall .pill{background:rgba(255,255,255,.16);color:#fff}
  .track{height:7px;border-radius:6px;background:#eaeef4;margin-top:10px;overflow:hidden}
  .kpi.overall .track{background:rgba(255,255,255,.18)}
  .track > span{display:block;height:100%;border-radius:6px}
  .fill-accent{background:var(--accent)} .fill-green{background:var(--green)} .fill-amber{background:var(--amber)} .fill-rose{background:var(--rose)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(1,1,49,.04)}
  .panel h2{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .panel h2 .hint{font-size:11px;font-weight:600;color:var(--muted)}

  .stack{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
  .stack > div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;min-width:0}
  .seg-green{background:var(--green)} .seg-amber{background:var(--amber)} .seg-rose{background:var(--rose)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:5px;vertical-align:middle}

  .crow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .crow:last-child{margin-bottom:0}
  .crow .cname{width:160px;flex:0 0 auto;font-weight:700;font-size:13px}
  .crow .cbar{flex:1;height:16px;border-radius:5px;background:#eef2f7;overflow:hidden}
  .crow .cbar > span{display:block;height:100%;border-radius:5px}
  .crow .cscore{width:64px;flex:0 0 auto;text-align:end;font-weight:800;font-variant-numeric:tabular-nums}
  .crow .cscore small{color:var(--muted);font-weight:600}

  .funnel{display:flex;gap:10px}
  .fbox{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:12px 6px;background:#fbfcfe}
  .fbox .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .fbox .t{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}

  .section-title{font-size:13px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 10px}
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:820px){.cards{grid-template-columns:1fr}}
  .node{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;text-align:start;width:100%;font-family:inherit}
  .node:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(1,1,49,.10);border-color:#c9d6ea}
  .node .ntop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .node .nname{font-size:14px;font-weight:800;color:var(--navy)}
  .node .nmeta{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
  .node .nscore{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .node .nof{font-size:11px;color:var(--muted);font-weight:600}
  .minirow{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px}
  .minirow .ml{width:74px;flex:0 0 auto;color:var(--muted);font-weight:600}
  .minirow .mbar{flex:1;height:8px;border-radius:4px;background:#eef2f7;overflow:hidden}
  .minirow .mbar > span{display:block;height:100%}
  .minirow .mv{width:30px;text-align:end;font-weight:700;font-variant-numeric:tabular-nums}
  .node .drill{font-size:11px;color:var(--accent-deep);font-weight:700;margin-top:10px}

  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:var(--card)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f6f9fd}
  td.num{text-align:end;font-variant-numeric:tabular-nums;font-weight:700}
  .tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:100px}
  .tag.embedded{background:var(--greenbg);color:#166534}.tag.practising{background:var(--amberbg);color:#92400e}
  .tag.emerging{background:var(--rosebg);color:#9f1239}.tag.pending{background:#eef2f7;color:#64748b}

  .overlay{position:fixed;inset:0;background:rgba(4,6,20,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.on{display:flex}
  .drawer{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .dhead{background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;padding:20px 22px;border-radius:16px 16px 0 0;position:relative}
  .dhead .close{position:absolute;top:14px;inset-inline-end:16px;background:rgba(255,255,255,.16);border:0;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;font-weight:700}
  .dhead .dname{font-size:20px;font-weight:800}
  .dhead .dmeta{font-size:12.5px;opacity:.85;margin-top:2px}
  .dhead .drow{display:flex;align-items:flex-end;gap:10px;margin-top:12px}
  .dhead .dnum{font-size:34px;font-weight:800;line-height:1}
  .dbody{padding:20px 22px}
  .dbody .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 8px}
  .note{font-size:12px;color:var(--muted);line-height:1.55;background:#f6f9fd;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
  .note b{color:var(--ink)}

  .ins{display:flex;flex-direction:column;gap:9px}
  .insitem{display:flex;gap:10px;align-items:flex-start;font-size:13px}
  .insitem .ic{width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
  .ic.good{background:var(--green)} .ic.warn{background:var(--amber)} .ic.bad{background:var(--rose)} .ic.info{background:var(--accent-deep)}
  .insitem b{color:var(--navy)}

  footer.foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <h1 id="brandTitle">AI Readiness Compass</h1>
        <div class="sub" id="brandSub">Organizational Dashboard</div>
      </div>
    </div>
    <div class="hgroup">
      <span class="sample-badge" id="sampleBadge">Sample data</span>
      <div class="langtoggle">
        <button id="enBtn" class="on" onclick="setLang('en')">EN</button>
        <button id="arBtn" onclick="setLang('ar')">ع</button>
      </div>
    </div>
  </header>

  <div class="orgline" id="orgLine"></div>
  <nav class="crumbs" id="crumbs"></nav>

  <section class="kpis" id="kpis"></section>

  <div class="grid2">
    <div class="panel">
      <h2 id="pDist"><span></span><span class="hint" id="pDistN"></span></h2>
      <div class="stack" id="stack"></div>
      <div class="legend" id="distLegend"></div>
      <div class="funnel" id="funnel" style="margin-top:16px"></div>
    </div>
    <div class="panel">
      <h2 id="pConstruct"><span></span></h2>
      <div id="constructRows"></div>
    </div>
  </div>

  <div class="section-title" id="childTitle"></div>
  <div id="childArea"></div>

  <div class="panel" style="margin-top:14px">
    <h2 id="pInsights"><span></span></h2>
    <div class="ins" id="insights"></div>
  </div>

  <footer class="foot">
    <span id="footL"></span>
    <span id="footR"></span>
  </footer>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer" id="drawer"></div>
</div>

    detailNote:"من هنا يُفتح <b>التقرير الفردي التفصيلي</b> الكامل - مستوى الجاهزية، ونقاط القوة، ومجالات التطوير، والمقارنة مع الإدارة والمؤسسة، وخطة تدريب موجهة.",
    footL:"بوصلة الجاهزية للذكاء الاصطناعي · لوحة المؤشرات المؤسسية · نموذج",
    footR:"تاريخ الإصدار "+DATA.generated_at, gap:"الفجوة",
  }
};
const t = k => T[LANG][k];
const nl = (o,f) => o[f+"_"+LANG] ?? o[f+"_en"];       // raw
const nlx = (o,f) => esc(nl(o,f));                       // escaped for markup
const num = n => LANG==='ar' ? n.toLocaleString('ar-EG',{minimumFractionDigits:1,maximumFractionDigits:1}) : n.toFixed(1);
const int = n => LANG==='ar' ? n.toLocaleString('ar-EG') : String(n);
const bandKey = w => ({Emerging:'emerging',Practising:'practising',Embedded:'embedded'})[w];
const scoreFill = s => s>=4?'fill-green':s>=3?'fill-amber':'fill-rose';
const scoreColor = s => s>=4?'var(--green)':s>=3?'var(--amber)':'var(--rose)';

function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.documentElement.dir = l==='ar'?'rtl':'ltr';
  document.getElementById('enBtn').classList.toggle('on',l==='en');
  document.getElementById('arBtn').classList.toggle('on',l==='ar');
  render();
}

function currentNode(){
  if(state.division==null) return {level:'overall', summary:DATA.overall, node:null};
  const div = DATA.divisions.find(d=>d.name_en===state.division);
  if(state.department==null) return {level:'division', summary:div.summary, node:div};
  const dep = div.departments.find(d=>d.name_en===state.department);
  return {level:'department', summary:dep.summary, node:dep, division:div};
}

function render(){
  const {summary} = currentNode();
  document.getElementById('brandTitle').textContent=t('brand');
  document.getElementById('brandSub').textContent=t('sub');
  document.getElementById('sampleBadge').textContent=t('sample');
  setHTML(document.getElementById('orgLine'), `<b>${nlx(DATA.org,'name')}</b> · ${nlx(DATA.org,'note')}`);
  document.getElementById('footL').textContent=t('footL');
  document.getElementById('footR').textContent=t('footR');
  renderCrumbs();
  renderKpis(summary);
  renderDist(summary);
  renderConstructs(summary);
  renderChildren();
  renderInsights();
}

function renderCrumbs(){
  let h=`<button onclick="goOverall()">${esc(t('org'))}</button>`;
  if(state.division){
    const div=DATA.divisions.find(d=>d.name_en===state.division);
    h+=`<span class="sep">›</span>`;
    if(state.department) h+=`<button onclick="goDivision('${esc(state.division).replace(/'/g,"\\'")}')">${nlx(div,'name')}</button>`;
    else h+=`<span class="here">${nlx(div,'name')}</span>`;
  }
  if(state.department){
    const div=DATA.divisions.find(d=>d.name_en===state.division);
    const dep=div.departments.find(d=>d.name_en===state.department);
    h+=`<span class="sep">›</span><span class="here">${nlx(dep,'name')}</span>`;
  }
  setHTML(document.getElementById('crumbs'), h);
}

function kpiCard(lbl,score){
  return `<div class="kpi">
    <div class="lbl">${esc(lbl)}</div>
    <div><span class="val">${num(score)}</span> <span class="of">${t('of')}</span></div>
    <div class="track"><span class="${scoreFill(score)}" style="width:${score/5*100}%"></span></div>
  </div>`;
}
function renderKpis(s){
  const b=s.band_en;
  const html=`
    <div class="kpi overall">
      <div class="lbl">${esc(t('overall'))}</div>
      <div><span class="val">${num(s.overall)}</span> <span class="of">${t('of')}</span></div>
      <span class="pill ${bandKey(b)}">${esc(t(bandKey(b)))}</span>
      <div class="track"><span style="width:${s.overall/5*100}%;background:#fff"></span></div>
    </div>
    ${kpiCard(t('awareness'),s.awareness)}
    ${kpiCard(t('adoption'),s.adoption)}
    ${kpiCard(t('readiness'),s.readiness)}`;
  setHTML(document.getElementById('kpis'), html);
}

function renderDist(s){
  document.querySelector('#pDist span').textContent=t('bandDist');
  document.getElementById('pDistN').textContent=`${int(s.n_completed)} ${t('assessed')}`;
  const d=s.dist, total=s.n_completed||1;
  const seg=(cls,n)=>{const pct=n/total*100;return pct>0?`<div class="${cls}" style="width:${pct}%">${pct>=9?int(n):''}</div>`:''};
  setHTML(document.getElementById('stack'), seg('seg-green',d.Embedded)+seg('seg-amber',d.Practising)+seg('seg-rose',d.Emerging));
  setHTML(document.getElementById('distLegend'),
    `<span><span class="dot" style="background:var(--green)"></span>${esc(t('embedded'))} · ${int(d.Embedded)}</span>
     <span><span class="dot" style="background:var(--amber)"></span>${esc(t('practising'))} · ${int(d.Practising)}</span>
     <span><span class="dot" style="background:var(--rose)"></span>${esc(t('emerging'))} · ${int(d.Emerging)}</span>`);
  setHTML(document.getElementById('funnel'),
    `<div class="fbox"><div class="n">${int(s.n_completed)}</div><div class="t">${esc(t('completed'))}</div></div>
     <div class="fbox"><div class="n">${int(s.n_in_progress)}</div><div class="t">${esc(t('inProgress'))}</div></div>
     <div class="fbox"><div class="n">${int(s.n_not_started)}</div><div class="t">${esc(t('notStarted'))}</div></div>
     <div class="fbox"><div class="n">${int(s.completion_pct)}%</div><div class="t">${esc(t('completion'))}</div></div>`);
}

function constructRow(name,score){
  return `<div class="crow">
    <div class="cname">${esc(name)}</div>
    <div class="cbar"><span style="width:${score/5*100}%;background:${scoreColor(score)}"></span></div>
    <div class="cscore">${num(score)}<small> ${t('of')}</small></div>
  </div>`;
}
function renderConstructs(s){
  document.querySelector('#pConstruct span').textContent=t('constructTitle');
  setHTML(document.getElementById('constructRows'),
    constructRow(t('awareness'),s.awareness)+constructRow(t('adoption'),s.adoption)+constructRow(t('readiness'),s.readiness));
}

function miniRow(label,score){
  return `<div class="minirow"><span class="ml">${esc(label)}</span>
    <span class="mbar"><span style="width:${score/5*100}%;background:${scoreColor(score)}"></span></span>
    <span class="mv">${num(score)}</span></div>`;
}
function nodeCard(node,onclick,drillLabel){
  const s=node.summary;
  return `<button class="node" onclick="${onclick}">
    <div class="ntop">
      <div>
        <div class="nname">${nlx(node,'name')}</div>
        <div class="nmeta">${int(s.n_completed)} ${t('assessed')} · ${int(s.completion_pct)}% ${t('completion')}</div>
      </div>
      <div style="text-align:end">
        <div class="nscore" style="color:${scoreColor(s.overall)}">${num(s.overall)}</div>
        <div class="nof">${t('of')}</div>
      </div>
    </div>
    ${miniRow(t('awareness'),s.awareness)}
    ${miniRow(t('adoption'),s.adoption)}
    ${miniRow(t('readiness'),s.readiness)}
    <div class="drill">${esc(drillLabel)} →</div>
  </button>`;
}

function renderChildren(){
  const {level,node}=currentNode();
  const title=document.getElementById('childTitle');
  const area=document.getElementById('childArea');
  if(level==='overall'){
    title.textContent=t('divisions');
    setHTML(area, `<div class="cards">`+DATA.divisions.map(d=>
      nodeCard(d,`goDivision('${esc(d.name_en).replace(/'/g,"\\'")}')`,t('clickDivision'))).join('')+`</div>`);
  } else if(level==='division'){
    title.textContent=t('departments');
    setHTML(area, `<div class="cards">`+node.departments.map(d=>
      nodeCard(d,`goDepartment('${esc(d.name_en).replace(/'/g,"\\'")}')`,t('clickDept'))).join('')+`</div>`);
  } else {
    title.textContent=t('people');
    const emps=node.employees.slice().sort((a,b)=>(b.overall??-1)-(a.overall??-1));
    const rows=emps.map(e=>{
      const done=e.status==='completed';
      const tagCls=done?bandKey(e.band_en):'pending';
      const tagTxt=done?t(bandKey(e.band_en)):(e.status==='in_progress'?t('inProgress'):t('notStarted'));
      return `<tr onclick="openEmployee('${esc(e.id)}')">
        <td><b>${nlx(e,'name')}</b></td>
        <td style="color:var(--muted)">${nlx(e,'title')}</td>
        <td class="num">${done?num(e.awareness):'—'}</td>
        <td class="num">${done?num(e.adoption):'—'}</td>
        <td class="num">${done?num(e.readiness):'—'}</td>
        <td class="num" style="color:${done?scoreColor(e.overall):'inherit'}">${done?num(e.overall):'—'}</td>
        <td><span class="tag ${tagCls}">${esc(tagTxt)}</span></td>
      </tr>`;
    }).join('');
    setHTML(area, `<div class="panel"><div class="tablewrap"><table>
      <thead><tr>
        <th>${esc(t('name'))}</th><th>${esc(t('title'))}</th>
        <th style="text-align:end">${esc(t('awareness'))}</th>
        <th style="text-align:end">${esc(t('adoption'))}</th>
        <th style="text-align:end">${esc(t('readiness'))}</th>
        <th style="text-align:end">${esc(t('overall'))}</th>
        <th>${esc(t('band'))}</th>
      </tr></thead><tbody>${rows}</tbody></table></div></div>`);
  }
}

function renderInsights(){
  const {level,summary,node}=currentNode();
  const ins=[];
  const cs=[['awareness',summary.awareness],['adoption',summary.adoption],['readiness',summary.readiness]];
  cs.sort((a,b)=>b[1]-a[1]);
  ins.push({ic:'good',html:`<b>${esc(t('strongest'))}:</b> ${esc(t(cs[0][0]))} — ${num(cs[0][1])} ${t('of5')}`});
  ins.push({ic:'warn',html:`<b>${esc(t('weakest'))}:</b> ${esc(t(cs[2][0]))} — ${num(cs[2][1])} ${t('of5')} (${t('gap')} ${num(cs[0][1]-cs[2][1])})`});
  if(level==='overall'){
    const divs=DATA.divisions.slice().sort((a,b)=>b.summary.overall-a.summary.overall);
    ins.push({ic:'info',html:`<b>${esc(t('topArea'))}:</b> ${nlx(divs[0],'name')} — ${num(divs[0].summary.overall)}`});
    ins.push({ic:'bad',html:`<b>${esc(t('lowArea'))}:</b> ${nlx(divs[divs.length-1],'name')} — ${num(divs[divs.length-1].summary.overall)}`});
  } else if(level==='division'){
    const deps=node.departments.slice().sort((a,b)=>b.summary.overall-a.summary.overall);
    ins.push({ic:'info',html:`<b>${esc(t('topArea'))}:</b> ${nlx(deps[0],'name')} — ${num(deps[0].summary.overall)}`});
    ins.push({ic:'bad',html:`<b>${esc(t('lowArea'))}:</b> ${nlx(deps[deps.length-1],'name')} — ${num(deps[deps.length-1].summary.overall)}`});
  }
  document.querySelector('#pInsights span').textContent=t('insights');
  setHTML(document.getElementById('insights'), ins.map(i=>
    `<div class="insitem"><span class="ic ${i.ic}">${i.ic==='good'?'✓':i.ic==='warn'?'!':i.ic==='bad'?'▼':'i'}</span><span>${i.html}</span></div>`).join(''));
}

function goOverall(){state={division:null,department:null};render();scrollTop();}
function goDivision(d){state={division:d,department:null};render();scrollTop();}
function goDepartment(d){state.department=d;render();scrollTop();}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}

function findEmployee(id){
  for(const div of DATA.divisions) for(const dep of div.departments)
    for(const e of dep.employees) if(e.id===id) return e;
  return null;
}
function openEmployee(id){
  const e=findEmployee(id);
  const dr=document.getElementById('drawer');
  if(e.status!=='completed'){
    setHTML(dr, `<div class="dhead"><button class="close" onclick="closeDrawer()">×</button>
      <div class="dname">${nlx(e,'name')}</div><div class="dmeta">${nlx(e,'title')} · ${nlx(e,'department')}</div></div>
      <div class="dbody"><div class="note">${esc(e.status==='in_progress'?t('inProgress'):t('notStarted'))}.</div></div>`);
    document.getElementById('overlay').classList.add('on');return;
  }
  const cs=[['awareness',e.awareness],['adoption',e.adoption],['readiness',e.readiness]].sort((a,b)=>b[1]-a[1]);
  setHTML(dr, `<div class="dhead"><button class="close" onclick="closeDrawer()">×</button>
    <div class="dname">${nlx(e,'name')}</div>
    <div class="dmeta">${nlx(e,'title')} · ${nlx(e,'department')} · ${nlx(e,'division')}</div>
    <div class="drow"><span class="dnum">${num(e.overall)}</span><span style="opacity:.7;margin-bottom:5px">${t('of')}</span>
      <span class="pill ${bandKey(e.band_en)}" style="margin:0 0 4px 0">${esc(t(bandKey(e.band_en)))}</span></div>
   </div>
   <div class="dbody">
     <div class="lbl">${esc(t('constructTitle'))}</div>
     ${constructRow(t('awareness'),e.awareness)}
     ${constructRow(t('adoption'),e.adoption)}
     ${constructRow(t('readiness'),e.readiness)}
     <div class="lbl">${esc(t('strongest'))} / ${esc(t('weakest'))}</div>
     <div class="insitem"><span class="ic good">✓</span><span><b>${esc(t(cs[0][0]))}</b> — ${num(cs[0][1])} ${t('of5')}</span></div>
     <div class="insitem" style="margin-top:6px"><span class="ic warn">!</span><span><b>${esc(t(cs[2][0]))}</b> — ${num(cs[2][1])} ${t('of5')} (${t('gap')} ${num(cs[0][1]-cs[2][1])})</span></div>
     <div class="note">${t('detailNote')}</div>
   </div>`);
  document.getElementById('overlay').classList.add('on');
}
function closeDrawer(){document.getElementById('overlay').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

setLang('en');
</script>
</body>
</html>
